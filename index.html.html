<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BULL-HIT | Street Racing</title>
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --bg-dark: #0a0c10;
            --panel-bg: rgba(18, 22, 31, 0.95);
            --accent-blue: #00a2ff;
            --accent-gold: #ffb700;
            --text-main: #ffffff;
            --text-muted: #8a94a6;
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-dark); color: var(--text-main); }
        #canvas3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; background-color: var(--bg-dark); padding: 15px; padding-top: calc(15px + env(safe-area-inset-top)); }
        .hidden { display: none !important; }
        .header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 10px 20px; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%); z-index: 20; }
        .game-title { font-size: 24px; font-weight: 900; font-style: italic; letter-spacing: 2px; background: linear-gradient(45deg, #fff, var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .currency-display { background: rgba(255, 183, 0, 0.15); border: 1px solid var(--accent-gold); padding: 6px 15px; border-radius: 6px; font-weight: bold; color: var(--accent-gold); font-size: 16px; }
        #main-menu { justify-content: center; align-items: center; background: radial-gradient(circle, rgba(20,25,35,0.8) 0%, rgba(10,12,16,1) 100%); }
        .menu-buttons { display: grid; grid-template-columns: repeat(2, 180px); gap: 15px; margin-top: 30px; }
        .btn { background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px; font-size: 14px; font-weight: bold; text-transform: uppercase; border-radius: 8px; cursor: pointer; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-primary { background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%); border: none; }
        .cheat-container { margin-top: 25px; display: flex; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; }
        .cheat-input { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 4px; font-size: 12px; width: 120px; text-align: center; }
        .workspace { flex: 1; display: flex; flex-direction: row; gap: 20px; margin-top: 10px; height: calc(100% - 70px); }
        .left-panel { width: 35%; background: var(--panel-bg); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.05); }
        .right-panel-view { width: 65%; position: relative; border-radius: 12px; overflow: hidden; }
        .item-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .item-card.active { border-color: var(--accent-blue); background: rgba(0, 162, 255, 0.1); }
        .item-info h4 { font-size: 14px; margin-bottom: 4px; }
        .item-info p { font-size: 11px; color: var(--text-muted); }
        .stats-container { background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .stat-row { margin-bottom: 6px; }
        .stat-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 2px; text-transform: uppercase; }
        .stat-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: var(--accent-blue); width: 0%; transition: width 0.3s ease; }
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; background: rgba(255,255,255,0.05); border: none; color: white; padding: 8px; font-size: 11px; font-weight: bold; border-radius: 4px; text-transform: uppercase; }
        .tab-btn.active { background: var(--accent-blue); }
        .color-section-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin: 8px 0 4px 0; letter-spacing: 1px; }
        .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
        .color-picker { aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; position: relative; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
        .color-picker.selected { border-color: #fff; transform: scale(1.05); }
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; background: transparent; }
        .hud-top { display: flex; justify-content: space-between; width: 100%; pointer-events: auto; }
        .hud-bottom { display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
        .speedometer { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 50px; border-left: 4px solid var(--accent-blue); font-style: italic; }
        .speed-val { font-size: 28px; font-weight: 900; color: #fff; }
        .speed-unit { font-size: 12px; color: var(--text-muted); }
        .controls-layer { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 40px; z-index: 100; pointer-events: none; }
        .control-btn { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-size: 14px; pointer-events: auto; backdrop-filter: blur(5px); }
        .steer-controls, .pedal-controls { display: flex; gap: 20px; }
        #race-summary { background: rgba(10,12,16,0.95); justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="canvas3d"></div>
    <div id="hud" class="hidden">
        <div class="hud-top">
            <button class="btn" style="padding:5px 15px;" onclick="exitRace()">Abandonar</button>
            <div id="race-pos" style="font-size:20px; font-weight:bold; text-shadow:0 2px 4px #000;">POS: 1 / 2</div>
        </div>
        <div class="hud-bottom">
            <div class="speedometer"><span id="live-speed" class="speed-val">0</span> <span class="speed-unit">km/h</span></div>
        </div>
    </div>
    <div id="controls-ui" class="controls-layer hidden">
        <div class="steer-controls">
            <div class="control-btn" id="btn-left">◀</div>
            <div class="control-btn" id="btn-right">▶</div>
        </div>
        <div style="color:rgba(255,255,255,0.3); font-size:11px; align-self:center;" id="gyro-notice">Giroscopio Activo</div>
        <div class="pedal-controls">
            <div class="control-btn" id="btn-brake" style="background:rgba(235, 64, 52, 0.2)">FRENO</div>
            <div class="control-btn" id="btn-gas" style="background:rgba(52, 235, 113, 0.2)">GAS</div>
        </div>
    </div>
    <div id="main-menu" class="screen">
        <div class="game-title">BULL-HIT</div>
        <div style="font-size: 12px; color: var(--accent-blue); font-weight: bold; letter-spacing: 3px;">STREET RACING</div>
        <div class="currency-display" style="margin-top: 15px;"><span id="menu-md">25.000</span> MD</div>
        <div class="menu-buttons">
            <button class="btn btn-primary" onclick="startRace()">Carrera Rápida</button>
            <button class="btn" onclick="openGarage()">Mi Garaje</button>
            <button class="btn" onclick="openShop()">Concesionario</button>
            <button class="btn" onclick="openCustomization()">Taller</button>
        </div>
        <div class="cheat-container">
            <input type="text" id="cheat-box" class="cheat-input" placeholder="Código Secreto">
            <button class="btn" style="padding:6px 12px; font-size:11px;" onclick="applyCheat()">Activar</button>
        </div>
    </div>
    <div id="shop-menu" class="screen hidden">
        <div class="header">
            <button class="btn" onclick="backToMenu()">◀ Volver</button>
            <div class="game-title" style="font-size:18px;">CONCESIONARIO</div>
            <div class="currency-display"><span class="md-val">0</span> MD</div>
        </div>
        <div class="workspace">
            <div class="left-panel" id="shop-list"></div>
            <div class="right-panel-view">
                <div style="position:absolute; bottom:15px; right:15px; z-index:30;">
                    <button class="btn btn-primary" id="buy-btn" onclick="buyCurrentCar()">Comprar Coche</button>
                </div>
            </div>
        </div>
    </div>
    <div id="garage-menu" class="screen hidden">
        <div class="header">
            <button class="btn" onclick="backToMenu()">◀ Volver</button>
            <div class="game-title" style="font-size:18px;">MI GARAJE</div>
            <div class="currency-display"><span class="md-val">0</span> MD</div>
        </div>
        <div class="workspace">
            <div class="left-panel" id="garage-list"></div>
            <div class="right-panel-view">
                <div style="position:absolute; bottom:15px; right:15px; z-index:30;">
